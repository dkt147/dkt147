<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
    .role { font: 600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9fe8ff; letter-spacing: 3px; }
    .tag  { font: 600 15px 'Fira Code', Consolas, monospace; fill: #0f2027; }
    .fade1 { opacity: 0; animation: up .9s ease-out .1s forwards; }
    .fade2 { opacity: 0; animation: up .9s ease-out .5s forwards; }
    .fade3 { opacity: 0; animation: up .9s ease-out .9s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .wave1 { animation: drift 9s ease-in-out infinite alternate; }
    .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .sweep { animation: sweep 5s ease-in-out 1.5s infinite; }
    @keyframes sweep { from { transform: translateX(-400px); } to { transform: translateX(1300px); } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; }
    @keyframes pulse { 0%,100% { opacity: .15; } 50% { opacity: .85; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <!-- network dots -->
    <g fill="#00c6ff">
      <circle class="dot" cx="90" cy="60" r="3"/><circle class="dot d2" cx="160" cy="110" r="2.5"/>
      <circle class="dot d3" cx="1080" cy="55" r="3"/><circle class="dot d4" cx="1130" cy="120" r="2.5"/>
      <circle class="dot d2" cx="1010" cy="95" r="2"/><circle class="dot d3" cx="220" cy="50" r="2"/>
    </g>
    <g stroke="#00c6ff" stroke-opacity=".18" stroke-width="1">
      <line x1="90" y1="60" x2="160" y2="110"/><line x1="160" y1="110" x2="220" y2="50"/>
      <line x1="1080" y1="55" x2="1130" y2="120"/><line x1="1010" y1="95" x2="1080" y2="55"/>
    </g>
    <!-- waves -->
    <path class="wave2" fill="#00c6ff" fill-opacity=".10" d="M0 205 C 150 170 300 240 450 205 S 750 170 900 205 S 1200 240 1350 205 L1350 260 L0 260 Z"/>
    <path class="wave1" fill="url(#accent)" fill-opacity=".35" d="M0 225 C 160 195 320 255 480 225 S 800 195 960 225 S 1280 255 1440 225 L1440 260 L0 260 Z"/>
    <!-- text -->
    <text class="name fade1" x="600" y="112" text-anchor="middle">Daniyal Khan</text>
    <text class="role fade2" x="600" y="152" text-anchor="middle">AI AUTOMATION  ·  FULL STACK DEVELOPER</text>
    <g class="fade3">
      <rect x="378" y="170" width="132" height="28" rx="14" fill="#00c6ff"/><text class="tag" x="444" y="189" text-anchor="middle">AI MVPs</text>
      <rect x="520" y="170" width="160" height="28" rx="14" fill="#9fe8ff"/><text class="tag" x="600" y="189" text-anchor="middle">RAG Chatbots</text>
      <rect x="690" y="170" width="132" height="28" rx="14" fill="#b8a4ff"/><text class="tag" x="756" y="189" text-anchor="middle">Agentic AI</text>
    </g>
    <rect class="sweep" x="0" y="0" width="260" height="260" fill="url(#shine)"/>
  </g>
</svg>
